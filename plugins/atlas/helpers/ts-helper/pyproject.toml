[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ts-helper"
version = "0.1.0"
description = "tree-sitter structure-extraction helper for the atlas plugin (the optional parser ceiling)"
readme = "README.md"
requires-python = ">=3.9"
# Pin the grammar EXACTLY. The helper reports symbol spans; atlas hashes the
# bytes between them, so a grammar upgrade that shifts a declaration's span
# boundaries re-hashes those symbols and re-judges their cells. Treat a bump
# like a generator-fingerprint bump: deliberate, recorded, and rolled out in
# lockstep. (design-v2 "Risks" / decision 26.)
dependencies = [
    "tree-sitter-language-pack==0.9.1",  # bundles tree-sitter==0.23.2 + Swift
]

[project.scripts]
# Installs `atlas-ts-helper` on PATH — exactly what atlas's ts_helper_path()
# probes for (after $ATLAS_TS_HELPER).
atlas-ts-helper = "atlas_ts_helper:main"

[tool.setuptools]
py-modules = ["atlas_ts_helper"]
