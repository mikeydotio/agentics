# deployit per-machine config.
# Bootstrap writes this file the first time; subsequent runs preserve overrides.

[server]
port = 8729
# Tailscale-served base URL. Bootstrap auto-derives from `tailscale status`.
# Must NOT have a trailing slash.
base_url = "https://<host>.<tailnet>.ts.net/deployit"

[index]
repo = "https://github.com/mikeydotio/deployit-index.git"

[macos]
# Whether to notarize macOS builds (.dmg) before serving. Requires an Apple
# Developer API key configured via `xcrun notarytool store-credentials`.
notarize = false
notary_profile = ""

[macos.sparkle]
# Opt-in Sparkle auto-update. When enabled, each macOS deploy also produces a
# .zip of the .app, EdDSA-signs it, and exposes a per-product appcast feed at
# <base_url>/p/<bundle_id>/macos/appcast.xml. The .dmg stays the manual download.
enabled = false
# Path to Sparkle's `sign_update` tool. Empty = search PATH and common SPM /
# Homebrew locations (see references/sparkle.md). Env override:
# DEPLOYIT_SPARKLE_SIGN_UPDATE.
sign_update_path = ""
# Path to the EdDSA private key file. Share ONE key across all your Macs (e.g.
# via ~/Enderchest syncthing) so every origin signs with the key the app's
# SUPublicEDKey verifies. Empty = sign_update uses its Keychain default
# (single-Mac only).
private_key_path = ""
# The matching public key, surfaced on the product page and after deploy for
# pasting into the app's Info.plist SUPublicEDKey.
public_ed_key = ""

[github]
# Publish a GitHub release (the Developer-ID-signed .app, archived as a .zip) on
# every macOS deploy, alongside the tailnet download page. The release is the
# final, recoverable deploy step — a publish failure never rolls back the
# already-served build. The deployit agent authors the release notes.
#
# Requires the GitHub CLI authenticated (`gh auth login`); the target repo is the
# app checkout's own `origin` remote. On by default — set false to disable, or
# pass `/deployit deploy --no-release` for a one-off skip.
release = true
# Mark releases as pre-releases.
prerelease = false
# Also upload the .dmg as a second release asset (the .zip is always attached).
attach_dmg = false
# Replace an existing release's asset + notes instead of failing on a tag clash.
# Equivalent to `/deployit deploy --clobber-release`.
clobber = false
# Notarization reuses [macos] notarize / notary_profile above: when configured,
# the .app is notarized + stapled before zipping so the download opens cleanly.
# Without it the released .app is Gatekeeper-quarantined (right-click → Open on
# first launch).
