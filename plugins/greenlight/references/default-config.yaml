# greenlight configuration
# Location: ~/.config/greenlight/config.yaml
# Changes take effect immediately (hook re-reads on every invocation)
# Manage with /greenlight command

# Permission modes where greenlight is DISABLED (space-separated)
# Valid modes: default, plan, acceptEdits, bypassPermissions
disabled_modes: bypassPermissions

# Analysis mode: standard | strict | permissive
#   standard   — deterministic allow/pass + AI fallback for uncertain
#   strict     — everything uncertain passes to user (no AI)
#   permissive — more lenient deterministic checks + AI for the rest
mode: standard

# AI fallback: call Claude API for uncertain commands. Opt-in (off by
# default) — it sits on the critical path of any autonomous loop (latency +
# token cost per uncertain command); turn it on deliberately if you want
# the extra judgment call for commands the deterministic checks can't place.
ai_enabled: false

# AI model for fallback analysis. Must be a structured-outputs-capable
# model (this feature depends on output_config.format) — currently Fable 5,
# Opus 4.8, Sonnet 5, Haiku 4.5, or legacy Opus 4.5/4.1. Haiku 4.5 is the
# cheapest/fastest of these and is the right size for a single boolean
# safety judgment.
ai_model: claude-haiku-4-5

# AI request timeout in seconds
ai_timeout: 10

# Show AI rationale to user when AI is invoked. Off by default (F082) — the
# rationale line is injected into the agent's context on every AI-approved
# command, which adds transcript noise on a long autonomous run.
ai_show_rationale: false

# Custom always-allow commands (space-separated base command names)
# Example: custom_allow: make tsc webpack
custom_allow:

# Custom always-pass commands (space-separated base command names)
# Example: custom_pass: terraform ansible
custom_pass:

# Log decisions to file (empty = disabled)
# Example: log_file: /home/you/.config/greenlight/greenlight.log
log_file:

# Verbose logging (debug-level detail)
verbose: false
